version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:///./academian_platform.db
      - SECRET_KEY=change-me-in-production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    command: >
      sh -c "python -c 'from database.db import init_db; init_db()' &&
             uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - academian_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - academian_network
    command: npm run dev

  # Optional: PostgreSQL for production use
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: academian
  #     POSTGRES_USER: academian
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - academian_network

networks:
  academian_network:
    driver: bridge

volumes:
  postgres_data:
